<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>404 - Royal Scroll Not Found • Princess Elizabeth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Intelligent SPA auto-recovery: If a godparent route landed here, redirect to hash route
    (function() {
      var path = window.location.pathname.replace(/^\/+|\/+$/g, '').toLowerCase();
      var known = [
        'andrew', 'darille', 'luis', 'kian', 'zanjoe', 'julius', 
        'joeschar', 'ibarra', 'johnpaul', 'shertone', 'ariel', 'tito-ariel',
        'sitti', 'alyssa', 'nicole', 'andjhelyka', 'analyn', 
        'marie-charlotte', 'maria-fe', 'mariafe', 'marie'
      ];
      if (known.indexOf(path) !== -1) {
        window.location.replace('/#' + path);
      }
    })();
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow-x: hidden;
      font-family: 'Montserrat', sans-serif;
      background: radial-gradient(circle at 50% 35%, #fff7f9 0%, #fde2e8 40%, #fbb6ce 80%, #f687b3 100%);
      color: #3d1a24;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px) 20px;
      text-align: center;
    }
    .container {
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #9d174d;
    }
    .duke-avatar {
      width: 170px;
      max-width: 48vw;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 12px 24px rgba(225, 29, 72, 0.22));
      animation: floatDuke 3.6s ease-in-out infinite alternate;
    }
    @keyframes floatDuke {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-8px) rotate(1deg); }
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.8rem, 5.5vw, 2.3rem);
      font-weight: 800;
      color: #831843;
      line-height: 1.15;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
    }
    .subtitle {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.05rem, 3.4vw, 1.25rem);
      color: #9f1239;
      line-height: 1.4;
      max-width: 320px;
    }
    .message {
      font-size: 0.92rem;
      line-height: 1.55;
      color: #4a2831;
      max-width: 320px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 280px;
      margin-top: 8px;
    }
    .btn-primary {
      display: block;
      padding: 14px 26px;
      background: linear-gradient(135deg, #e11d48, #ff2d55, #f43f5e);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      border-radius: 9999px;
      box-shadow: 0 8px 22px rgba(225, 29, 72, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-primary:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="badge">
      <span>👑</span>
      <span>Royal Decree • 404</span>
    </div>

    <img 
      src="/images/grand-duke.png" 
      alt="The Grand Duke" 
      class="duke-avatar"
    />

    <h1>Lost In The Kingdom?</h1>

    <p class="subtitle">
      “This Royal Invitation Scroll could not be found.”
    </p>

    <p class="message">
      The Grand Duke searched the royal records, but this link is missing or mistyped. Fret not, you are still warmly invited!
    </p>

    <div class="actions">
      <a href="/" class="btn-primary">Return to Royal Palace</a>
    </div>
  </main>
</body>
</html>
